<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>طلبات العملاء الميدانية | حلول المنازل</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;background:#f3f6fa}#app{display:block}</style></head><body><iframe id="app" src="field-v3.html?v=7" title="طلبات العملاء"></iframe><script>'use strict';const f=document.getElementById('app');let currentId='';const FIELD_ENDPOINT='https://mhplfjotafuudaduwjfo.supabase.co/functions/v1/field-requests';function fieldCode(){return sessionStorage.getItem('hulull_field_code')||''}async function fieldAction(action,id){const code=fieldCode();if(!code)throw new Error('NO_CODE');const r=await fetch(FIELD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','X-Field-Code':code},body:JSON.stringify({action,id}),cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'FAILED');return data}function enhance(){let d;try{d=f.contentDocument}catch(e){return}if(!d)return;if(!d.documentElement.dataset.hulullV7){d.documentElement.dataset.hulullV7='1';d.addEventListener('click',e=>{const o=e.target.closest?.('[data-open]');if(o?.dataset.open)currentId=o.dataset.open},true);const filters=d.querySelector('.filters');if(filters&&!filters.querySelector('[data-filter="signed"]')){const c=d.createElement('button');c.className='chip';c.dataset.filter='signed';c.textContent='تم التوقيع ✅';c.onclick=()=>{try{f.contentWindow.filter='signed'}catch(e){};d.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));const cards=d.querySelectorAll('.card');cards.forEach(card=>{const s=card.querySelector('.status');card.style.display=s?.classList.contains('signed')?'':'none'})};filters.appendChild(c)}}d.querySelectorAll('.status.signed').forEach(s=>{s.textContent='تم التوقيع ✅';s.style.cssText='background:#dcfce7;color:#166534'});d.querySelectorAll('.card').forEach(card=>{const open=card.querySelector('[data-open]');if(!open)return;const id=open.dataset.open;if(!id)return;if(!card.querySelector('.measure-action')){const done=!!card.querySelector('.status.completed,.status.signed');const b=d.createElement('button');b.className='btn btn-green measure-action';b.style.cssText='width:100%;margin-top:10px;min-height:52px;font-weight:800;font-size:15px';b.innerHTML=done?'✓ تمت المعاينة والتمتير':'✓ تم أخذ المقاسات';b.disabled=done;b.onclick=async()=>{if(!confirm('تأكيد إكمال التمتير وأخذ مقاسات العميل؟'))return;const code=fieldCode(),key=f.contentWindow.APP_CONFIG?.SUPABASE_PUBLISHABLE_KEY;if(!code||!key){alert('أعد تسجيل الدخول ثم حاول مرة أخرى');return}b.disabled=true;b.textContent='جاري الحفظ...';try{const r=await fetch('https://mhplfjotafuudaduwjfo.supabase.co/rest/v1/rpc/field_complete_booking',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({p_id:id,p_code:code})});const ok=await r.json().catch(()=>false);if(!r.ok||ok!==true)throw 0;b.textContent='✓ تمت المعاينة والتمتير';card.style.borderColor='#86efac';card.style.background='#f0fdf4';const s=card.querySelector('.status');if(s){s.textContent='تمت المعاينة والتمتير';s.className='status completed';s.style.cssText='background:#dcfce7;color:#166534'}b.classList.remove('btn-green');b.classList.add('btn-outline');b.disabled=true;}catch(e){b.disabled=false;b.textContent='✓ تم أخذ المقاسات';alert('تعذر حفظ حالة التمتير. حاول مرة أخرى.')}};card.appendChild(b)}});const body=d.getElementById('body'),actionGrid=body?.querySelector('.actiongrid');if(actionGrid&&!actionGrid.querySelector('.signed-action')){const id=currentId;const signed=d.getElementById('dStatus')?.textContent==='signed'||d.getElementById('dStatus')?.textContent?.includes('تم التوقيع');const b=d.createElement('button');b.type='button';b.className='btn btn-green signed-action';b.style.cssText='grid-column:1/-1;min-height:52px;font-size:15px;font-weight:800';b.textContent=signed?'تم التوقيع ✅':'تم التوقيع ✅';b.disabled=signed;b.onclick=async()=>{if(!id){alert('أغلق التفاصيل وافتح الطلب مرة ثانية ثم حاول');return}if(!confirm('تأكيد أن العميل وافق على السعر وتم توقيع العقد معه؟'))return;b.disabled=true;b.textContent='جاري الحفظ...';try{await fieldAction('signed',id);b.textContent='تم التوقيع ✅';const ds=d.getElementById('dStatus');if(ds)ds.textContent='تم التوقيع ✅';const card=[...d.querySelectorAll('.card')].find(x=>x.querySelector(`[data-open="${id}"]`));const s=card?.querySelector('.status');if(s){s.textContent='تم التوقيع ✅';s.className='status signed';s.style.cssText='background:#dcfce7;color:#166534'}try{await f.contentWindow.load?.()}catch(e){}alert('تم تسجيل توقيع العقد بنجاح ✅')}catch(e){b.disabled=false;b.textContent='تم التوقيع ✅';alert('تعذر حفظ حالة التوقيع. حاول مرة أخرى.')}};actionGrid.appendChild(b)}const ds=d.getElementById('dStatus');if(ds&&ds.textContent==='signed')ds.textContent='تم التوقيع ✅'}f.addEventListener('load',()=>{enhance();setInterval(enhance,500)});</script></body></html>
