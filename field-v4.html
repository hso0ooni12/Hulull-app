<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>طلبات العملاء الميدانية | حلول المنازل</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;background:#f3f6fa}#app{display:block}</style></head><body><iframe id="app" src="field-v3.html?v=5" title="طلبات العملاء"></iframe><script>'use strict';const f=document.getElementById('app');function enhance(){let d;try{d=f.contentDocument}catch(e){return}if(!d)return;d.querySelectorAll('.card').forEach(card=>{if(card.querySelector('.measure-action'))return;const open=card.querySelector('[data-open]');if(!open)return;const id=open.dataset.open;if(!id)return;const done=card.querySelector('.status.completed');const b=d.createElement('button');b.className='btn btn-green measure-action';b.style.cssText='width:100%;margin-top:10px;min-height:52px;font-weight:800;font-size:15px';b.innerHTML=done?'✓ تمت المعاينة والتمتير':'✓ تم أخذ المقاسات';b.disabled=!!done;b.onclick=async()=>{if(!confirm('تأكيد إكمال التمتير وأخذ مقاسات العميل؟'))return;const code=sessionStorage.getItem('hulull_field_code')||'';const key=f.contentWindow.APP_CONFIG?.SUPABASE_PUBLISHABLE_KEY;if(!code||!key){alert('أعد تسجيل الدخول ثم حاول مرة أخرى');return}b.disabled=true;b.textContent='جاري الحفظ...';try{const r=await fetch('https://mhplfjotafuudaduwjfo.supabase.co/rest/v1/rpc/field_complete_booking',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({p_id:id,p_code:code})});const ok=await r.json().catch(()=>false);if(!r.ok||ok!==true)throw 0;b.textContent='✓ تمت المعاينة والتمتير';card.style.borderColor='#86efac';const s=card.querySelector('.status');if(s){s.textContent='تمت المعاينة والتمتير';s.className='status completed';s.style.cssText='background:#dcfce7;color:#166534'}setTimeout(()=>{try{f.contentWindow.location.reload()}catch(e){}},700)}catch(e){b.disabled=false;b.textContent='✓ تم أخذ المقاسات';alert('تعذر حفظ حالة التمتير. حاول مرة أخرى.')}};card.appendChild(b)})}f.addEventListener('load',()=>{enhance();setInterval(enhance,700)});</script></body></html>
