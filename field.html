<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>طلبات المعاينة الميدانية | حلول المنازل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f3f6fa;--primary:#145b91;--primary2:#1f7ab8;--ok:#15803d;--okbg:#ecfdf3;--card:#fff;--shadow:0 12px 32px rgba(15,23,42,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Naskh Arabic',serif}button,input{font:inherit}.hidden{display:none!important}.wrap{width:min(100%,940px);margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand img{width:52px;height:52px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:15px;padding:5px}.brand h1{font:800 1rem 'Noto Kufi Arabic',sans-serif;margin:0}.brand p{color:var(--muted);font-size:.78rem;margin:3px 0 0}.icon{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink)}.login{min-height:88vh;display:grid;place-items:center}.login-card{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.login-card .logo{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px}.login-card h2{text-align:center;font:800 1.1rem 'Noto Kufi Arabic',sans-serif;margin:0 0 8px}.login-card p{text-align:center;color:var(--muted);line-height:1.9;margin:0 0 20px}.field{display:grid;gap:7px}.field label{font:700 .76rem 'Noto Kufi Arabic',sans-serif}.input{width:100%;border:1.5px solid #cbd5e1;border-radius:12px;background:#fff;padding:13px 14px;outline:0}.input:focus{border-color:var(--primary2);box-shadow:0 0 0 4px rgba(31,122,184,.1)}.btn{border:0;border-radius:12px;min-height:46px;padding:11px 16px;font:700 .76rem 'Noto Kufi Arabic',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.btn-soft{background:#eef2f7;color:var(--ink)}.btn-outline{background:#fff;color:var(--ink);border:1px solid #cbd5e1}.btn-green{background:var(--okbg);color:var(--ok);border:1px solid #bbf7d0}.login-card .btn{width:100%;margin-top:14px}.error{color:#b91c1c;text-align:center;margin:12px 0 0;font-weight:700}.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 7px 22px rgba(15,23,42,.04);margin-bottom:14px}.search{position:relative}.search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#94a3b8}.search input{padding-right:42px}.filters{display:flex;gap:8px;overflow:auto;padding-top:10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;font:700 .68rem 'Noto Kufi Arabic',sans-serif}.chip.active{background:#0f172a;color:#fff;border-color:#0f172a}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 2px;color:var(--muted);font-size:.82rem}.cards{display:grid;gap:12px}.request{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 22px rgba(15,23,42,.045)}.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font:800 .9rem 'Noto Kufi Arabic',sans-serif}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--okbg);color:var(--ok);padding:6px 10px;font:700 .61rem 'Noto Kufi Arabic',sans-serif}.date{margin-top:7px;font:700 .75rem 'Noto Kufi Arabic',sans-serif;color:#334155}.sub{color:var(--muted);font-size:.83rem;margin-top:5px;line-height:1.7}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.actions .btn{padding:9px 7px;min-height:42px;font-size:.68rem}.empty{padding:36px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:18px}.loading{padding:32px;text-align:center;color:var(--muted)}.detail{position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:50;display:grid;align-items:end}.sheet{background:#fff;border-radius:24px 24px 0 0;max-height:92dvh;overflow:auto;padding:18px 18px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -16px 50px rgba(15,23,42,.18)}.sheet-inner{width:min(100%,820px);margin:auto}.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:-18px;background:#fff;padding:18px 0 12px;z-index:2;border-bottom:1px solid var(--line)}.sheet-head h2{font:800 1rem 'Noto Kufi Arabic',sans-serif;margin:0}.close{width:40px;height:40px;border:0;border-radius:10px;background:#eef2f7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.item{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.item.full{grid-column:1/-1}.item small{display:block;color:var(--muted);font:600 .61rem 'Noto Kufi Arabic',sans-serif;margin-bottom:4px}.item b,.item a{color:var(--ink);font:700 .75rem 'Noto Kufi Arabic',sans-serif;text-decoration:none;word-break:break-word}.facade{width:100%;max-height:430px;object-fit:cover;border-radius:16px;border:1px solid var(--line);background:#f1f5f9;margin-top:5px}.big-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a5f;border-radius:12px;padding:11px 13px;line-height:1.8;font-size:.8rem}.stamp{font-size:.72rem;color:var(--muted);text-align:center;margin-top:14px}@media(max-width:600px){.wrap{padding-left:11px;padding-right:11px}.brand h1{font-size:.84rem}.brand p{font-size:.7rem}.grid{grid-template-columns:1fr}.item.full{grid-column:auto}.actions{grid-template-columns:1fr 1fr 1fr}.big-actions{grid-template-columns:1fr}.request{padding:14px}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <div class="login-card">
    <img class="logo" src="assets/logo.webp" alt="شعار حلول المنازل">
    <h2>طلبات المعاينة الميدانية</h2>
    <p>صفحة خاصة بموظف المعاينة والتمتير. أدخل رمز الدخول الميداني لعرض الطلبات المصرح بها.</p>
    <form id="loginForm">
      <div class="field"><label for="accessCode">رمز الدخول</label><input id="accessCode" class="input" type="password" autocomplete="one-time-code" required placeholder="أدخل الرمز"></div>
      <button id="loginBtn" class="btn btn-primary" type="submit"><i class="fa-solid fa-lock-open"></i> دخول</button>
      <div id="loginError" class="error hidden"></div>
    </form>
  </div>
</section>
<section id="appView" class="hidden">
<div class="wrap">
  <header class="top"><div class="brand"><img src="assets/logo.webp" alt=""><div><h1>طلبات المعاينة الميدانية</h1><p>حلول المنازل للعوازل</p></div></div><div><button id="refreshBtn" class="icon" aria-label="تحديث"><i class="fa-solid fa-rotate"></i></button> <button id="logoutBtn" class="icon" aria-label="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
  <section class="toolbar"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" class="input" placeholder="بحث بالاسم أو الجوال أو الحي"></div><div class="filters"><button class="chip active" data-filter="upcoming">القادمة</button><button class="chip" data-filter="today">اليوم</button><button class="chip" data-filter="all">الكل</button></div></section>
  <div class="meta"><span id="countLabel">—</span><span id="syncLabel"></span></div>
  <main id="cards" class="cards"></main>
</div>
</section>
<div id="detailView" class="detail hidden"><div class="sheet"><div class="sheet-inner"><div class="sheet-head"><div><h2 id="dName">تفاصيل الطلب</h2><div id="dWhen" class="date"></div></div><button id="closeDetail" class="close"><i class="fa-solid fa-xmark"></i></button></div><div id="detailBody"></div></div></div></div>
<script>
'use strict';
const ENDPOINT='https://mhplfjotafuudaduwjfo.supabase.co/functions/v1/field-requests';
const $=id=>document.getElementById(id);
let accessCode=sessionStorage.getItem('hulull_field_code')||'',requests=[],filter='upcoming';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const visitDate=r=>r.scheduled_date||r.preferred_date||'';
const visitTime=r=>String(r.scheduled_time||r.preferred_time||'').slice(0,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'))}catch{return d}};
const fmtTime=t=>{let h=Number(String(t).slice(0,2)),m=String(t).slice(3,5);if(!Number.isFinite(h))return t||'—';return `${h>12?h-12:(h||12)}:${m} ${h<12?'ص':'م'}`};
const phoneDigits=p=>String(p||'').replace(/\D/g,'');
const waPhone=p=>{let n=phoneDigits(p);if(n.startsWith('0'))n='966'+n.slice(1);return n};

$('loginForm').addEventListener('submit',async e=>{e.preventDefault();accessCode=$('accessCode').value.trim();await enter()});
$('refreshBtn').onclick=load;
$('logoutBtn').onclick=()=>{sessionStorage.removeItem('hulull_field_code');accessCode='';requests=[];$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('accessCode').value=''};
$('searchInput').oninput=render;
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
$('closeDetail').onclick=()=>$('detailView').classList.add('hidden');
$('detailView').onclick=e=>{if(e.target===$('detailView'))$('detailView').classList.add('hidden')};

async function enter(){
 const btn=$('loginBtn'),err=$('loginError');err.classList.add('hidden');btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول';
 try{await load(true);sessionStorage.setItem('hulull_field_code',accessCode);$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}
 catch(e){err.textContent=e.message==='INVALID_ACCESS_CODE'?'رمز الدخول غير صحيح.':'تعذر الاتصال. حاول مرة أخرى.';err.classList.remove('hidden')}
 finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-lock-open"></i> دخول'}
}
async function load(throwError=false){
 $('syncLabel').textContent='جاري التحديث...';
 try{
   const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','X-Field-Code':accessCode},body:'{}',cache:'no-store'});
   const data=await res.json().catch(()=>({}));
   if(!res.ok)throw new Error(data.error||'LOAD_FAILED');
   requests=Array.isArray(data.requests)?data.requests:[];
   render();$('syncLabel').textContent='آخر تحديث: '+new Intl.DateTimeFormat('ar-SA',{hour:'numeric',minute:'2-digit'}).format(new Date());
 }catch(e){$('syncLabel').textContent='تعذر التحديث';if(throwError)throw e;else $('cards').innerHTML='<div class="empty">تعذر تحميل الطلبات. اضغط تحديث وحاول مرة أخرى.</div>'}
}
function visibleRows(){
 const t=today(),q=$('searchInput')?.value.trim().toLowerCase()||'';
 return requests.filter(r=>{
   const d=visitDate(r);if(filter==='today'&&d!==t)return false;if(filter==='upcoming'&&d<t)return false;
   if(q&&![r.customer_name,r.customer_phone,r.location_label,r.customer_notes,r.admin_notes].join(' ').toLowerCase().includes(q))return false;
   return true;
 }).sort((a,b)=>visitDate(a).localeCompare(visitDate(b))||visitTime(a).localeCompare(visitTime(b)));
}
function render(){
 const rows=visibleRows();$('countLabel').textContent=`${rows.length} طلب`;
 $('cards').innerHTML=rows.length?rows.map(r=>`<article class="request"><div class="rhead"><div><div class="name">${esc(r.customer_name)}</div><div class="date"><i class="fa-regular fa-calendar"></i> ${esc(fmtDate(visitDate(r)))} · ${esc(fmtTime(visitTime(r)))}</div></div><span class="status"><i class="fa-solid fa-circle-check"></i> ${r.status==='scheduled'?'مجدول':'مقبول'}</span></div><div class="sub"><i class="fa-solid fa-location-dot"></i> ${esc(r.location_label||'لا يوجد وصف للحي')}</div><div class="actions"><a class="btn btn-green" href="tel:${esc(r.customer_phone)}"><i class="fa-solid fa-phone"></i> اتصال</a><a class="btn btn-green" target="_blank" rel="noopener" href="https://wa.me/${waPhone(r.customer_phone)}"><i class="fa-brands fa-whatsapp"></i> واتساب</a><button class="btn btn-primary" data-id="${esc(r.id)}"><i class="fa-solid fa-eye"></i> التفاصيل</button></div></article>`).join(''):'<div class="empty"><i class="fa-regular fa-calendar-check" style="font-size:2rem;margin-bottom:10px"></i><br>لا توجد طلبات مطابقة.</div>';
 $('cards').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
}
function openDetail(id){
 const r=requests.find(x=>x.id===id);if(!r)return;
 $('dName').textContent=r.customer_name||'تفاصيل الطلب';$('dWhen').textContent=`${fmtDate(visitDate(r))} · ${fmtTime(visitTime(r))}`;
 const mapUrl=Number.isFinite(Number(r.location_lat))&&Number.isFinite(Number(r.location_lng))?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.location_lat+','+r.location_lng)}`:'';
 const wa=`https://wa.me/${waPhone(r.customer_phone)}`;
 $('detailBody').innerHTML=`<div class="big-actions"><a class="btn btn-green" href="tel:${esc(r.customer_phone)}"><i class="fa-solid fa-phone"></i> اتصال بالعميل</a><a class="btn btn-green" href="${wa}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> واتساب</a>${mapUrl?`<a class="btn btn-primary" href="${mapUrl}" target="_blank" rel="noopener"><i class="fa-solid fa-map-location-dot"></i> فتح موقع المنزل</a>`:''}</div><div class="grid"><div class="item"><small>اسم العميل</small><b>${esc(r.customer_name||'—')}</b></div><div class="item"><small>رقم الجوال</small><a href="tel:${esc(r.customer_phone)}">${esc(r.customer_phone||'—')}</a></div><div class="item"><small>تاريخ الموعد</small><b>${esc(fmtDate(visitDate(r)))}</b></div><div class="item"><small>وقت الموعد</small><b>${esc(fmtTime(visitTime(r)))}</b></div><div class="item full"><small>وصف الموقع / الحي</small><b>${esc(r.location_label||'—')}</b></div><div class="item full"><small>ملاحظات العميل</small><b>${esc(r.customer_notes||'لا توجد ملاحظات')}</b></div>${r.admin_notes?`<div class="item full"><small>ملاحظات الإدارة</small><b>${esc(r.admin_notes)}</b></div>`:''}</div>${r.facade_url?`<div class="item full"><small>صورة واجهة المنزل</small><img class="facade" src="${esc(r.facade_url)}" alt="صورة واجهة منزل العميل"></div>`:'<div class="notice">صورة الواجهة غير متاحة حاليًا.</div>'}<div class="stamp">هذه الصفحة للمعاينة الميدانية فقط ولا تحتوي على البيانات المالية أو أدوات الإدارة.</div>`;
 $('detailView').classList.remove('hidden');
}
if(accessCode){enter()}else $('accessCode').focus();
</script>
</body>
</html>
