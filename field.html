<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>طلبات العملاء الميدانية | حلول المنازل</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f3f6fa;--pri:#145b91;--ok:#15803d;--bad:#b91c1c;--warn:#a16207}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.wrap{max-width:940px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:50px;height:50px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}.icon,.btn{border:0;border-radius:12px;min-height:44px;padding:10px 14px;font-weight:700}.icon{width:44px;background:#fff;border:1px solid var(--line)}.btn-primary{background:var(--pri);color:#fff}.btn-soft{background:#eef2f7;color:var(--ink)}.btn-green{background:#ecfdf3;color:var(--ok);border:1px solid #bbf7d0}.btn-red{background:#fff1f2;color:var(--bad);border:1px solid #fecdd3}.btn-outline{background:#fff;color:var(--ink);border:1px solid #cbd5e1}.login{min-height:90vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 20px 60px #0f172a18;text-align:center}.login-card img{width:82px;height:82px;object-fit:contain}.input,.select{width:100%;border:1.5px solid #cbd5e1;border-radius:12px;background:#fff;padding:12px 13px;outline:0}.toolbar{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:12px}.filters{display:flex;gap:7px;overflow:auto;padding-top:9px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:700}.chip.active{background:#0f172a;color:#fff}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:10px 2px}.cards{display:grid;gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 7px 22px #0f172a0b}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:17px;font-weight:800}.status{border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.pending{background:#fffbeb;color:var(--warn)}.accepted{background:#ecfdf3;color:var(--ok)}.rejected{background:#fff1f2;color:var(--bad)}.cancelled{background:#f1f5f9;color:#475569}.sub{color:var(--muted);font-size:14px;line-height:1.7;margin-top:5px}.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.acts .btn{padding:8px 5px;font-size:13px}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:34px;text-align:center;color:var(--muted)}.detail{position:fixed;inset:0;background:#0f172a88;z-index:50;display:grid;align-items:end}.sheet{background:#fff;border-radius:24px 24px 0 0;max-height:94dvh;overflow:auto;padding:17px 16px calc(24px + env(safe-area-inset-bottom))}.sheetin{max-width:820px;margin:auto}.sheethead{display:flex;justify-content:space-between;align-items:start;gap:10px;position:sticky;top:-17px;background:#fff;padding:17px 0 12px;border-bottom:1px solid var(--line);z-index:2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.item{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px}.item.full{grid-column:1/-1}.item small{display:block;color:var(--muted);margin-bottom:4px}.item b,.item a{color:var(--ink);text-decoration:none;word-break:break-word}.facade{width:100%;max-height:390px;object-fit:cover;border-radius:15px;border:1px solid var(--line)}.actiongrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.resched{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:12px}.resched h3{margin:0 0 10px;font-size:15px}.resgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{margin-top:9px;font-size:13px;font-weight:700}.okmsg{color:var(--ok)}.errmsg{color:var(--bad)}@media(max-width:620px){.acts{grid-template-columns:1fr 1fr}.grid,.resgrid{grid-template-columns:1fr}.item.full{grid-column:auto}.actiongrid{grid-template-columns:1fr 1fr}.brand h1{font-size:15px}}
</style></head><body>
<section id="loginView" class="login"><div class="login-card"><img src="assets/logo.webp" alt=""><h2>طلبات العملاء الميدانية</h2><p style="color:var(--muted);line-height:1.8">دخول الموظف المسؤول عن زيارة العملاء والمعاينة وإعادة الجدولة.</p><form id="loginForm"><input id="accessCode" class="input" type="password" placeholder="رمز الدخول" required><button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:12px">دخول</button><div id="loginError" class="errmsg hidden"></div></form></div></section>
<section id="appView" class="hidden"><div class="wrap"><header class="top"><div class="brand"><img src="assets/logo.webp" alt=""><div><h1>طلبات العملاء</h1><small>المعاينة الميدانية</small></div></div><div><button id="refreshBtn" class="icon"><i class="fa-solid fa-rotate"></i></button> <button id="logoutBtn" class="icon"><i class="fa-solid fa-right-from-bracket"></i></button></div></header><section class="toolbar"><input id="search" class="input" placeholder="بحث بالاسم أو الجوال أو الحي"><div class="filters"><button class="chip active" data-filter="all">الكل</button><button class="chip" data-filter="pending">تحت المراجعة</button><button class="chip" data-filter="accepted">مقبولة</button><button class="chip" data-filter="rejected">مرفوضة</button><button class="chip" data-filter="today">اليوم</button><button class="chip" data-filter="upcoming">القادمة</button></div></section><div class="meta"><span id="count">—</span><span id="sync"></span></div><main id="cards" class="cards"></main></div></section>
<div id="detail" class="detail hidden"><div class="sheet"><div class="sheetin"><div class="sheethead"><div><h2 id="dName" style="margin:0;font-size:18px">تفاصيل الطلب</h2><div id="dStatus" class="sub"></div></div><button id="close" class="icon"><i class="fa-solid fa-xmark"></i></button></div><div id="body"></div></div></div></div>
<script>
'use strict';const ENDPOINT='https://mhplfjotafuudaduwjfo.supabase.co/functions/v1/field-requests',$=id=>document.getElementById(id);let code=sessionStorage.getItem('hulull_field_code')||'',rows=[],filter='all',current=null;const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),vd=r=>r.scheduled_date||r.preferred_date||'',vt=r=>String(r.scheduled_time||r.preferred_time||'').slice(0,5),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),digits=s=>String(s||'').replace(/\D/g,''),wa=p=>{let n=digits(p);return n.startsWith('0')?'966'+n.slice(1):n},statusText=s=>({pending:'تحت المراجعة',accepted:'مقبول',rejected:'مرفوض',cancelled:'ملغي',scheduled:'مجدول'})[s]||s||'—';
async function api(body={action:'list'}){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','X-Field-Code':code},body:JSON.stringify(body),cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'SERVER_ERROR');return d}
$('loginForm').onsubmit=async e=>{e.preventDefault();code=$('accessCode').value.trim();$('loginBtn').disabled=true;try{await load(true);sessionStorage.setItem('hulull_field_code',code);$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}catch(e){$('loginError').textContent=e.message==='INVALID_ACCESS_CODE'?'رمز الدخول غير صحيح':'تعذر الدخول';$('loginError').classList.remove('hidden')}finally{$('loginBtn').disabled=false}};
$('refreshBtn').onclick=()=>load();$('logoutBtn').onclick=()=>{sessionStorage.removeItem('hulull_field_code');location.reload()};$('search').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});$('close').onclick=()=>$('detail').classList.add('hidden');$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').classList.add('hidden')};
async function load(throwErr=false){$('sync').textContent='جاري التحديث...';try{const d=await api();rows=d.requests||[];render();$('sync').textContent='تم التحديث'}catch(e){$('sync').textContent='تعذر التحديث';if(throwErr)throw e;else $('cards').innerHTML='<div class="empty">تعذر تحميل الطلبات.</div>'}}
function visible(){const q=$('search').value.trim().toLowerCase(),t=today();return rows.filter(r=>{if(filter==='pending'&&r.status!=='pending')return false;if(filter==='accepted'&&r.status!=='accepted'&&r.status!=='scheduled')return false;if(filter==='rejected'&&r.status!=='rejected')return false;if(filter==='today'&&vd(r)!==t)return false;if(filter==='upcoming'&&vd(r)<t)return false;if(q&&![r.customer_name,r.customer_phone,r.location_label,r.customer_notes].join(' ').toLowerCase().includes(q))return false;return true}).sort((a,b)=>(vd(a)||'9999').localeCompare(vd(b)||'9999')||vt(a).localeCompare(vt(b)))}
function render(){const a=visible();$('count').textContent=`${a.length} طلب`;$('cards').innerHTML=a.length?a.map(r=>`<article class="card"><div class="head"><div><div class="name">${esc(r.customer_name)}</div><div class="sub">${esc(r.customer_phone||'')} · ${esc(r.location_label||'بدون وصف')}</div></div><span class="status ${esc(r.status)}">${esc(statusText(r.status))}</span></div><div class="sub"><b>${esc(vd(r)||'بدون تاريخ')} ${esc(vt(r)||'')}</b></div><div class="acts"><button class="btn btn-outline" data-open="${r.id}">التفاصيل</button><a class="btn btn-green" href="tel:${esc(digits(r.customer_phone))}">اتصال</a><a class="btn btn-green" target="_blank" rel="noopener" href="https://wa.me/${esc(wa(r.customer_phone))}">واتساب</a>${r.status==='pending'?`<button class="btn btn-primary" data-accept="${r.id}">قبول</button>`:`<button class="btn btn-red" data-reject="${r.id}">رفض</button>`}</div></article>`).join(''):'<div class="empty">لا توجد طلبات مطابقة.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>act('accept',b.dataset.accept));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>act('reject',b.dataset.reject))}
function openDetail(id){current=rows.find(r=>r.id===id);if(!current)return;$('dName').textContent=current.customer_name;$('dStatus').textContent=statusText(current.status);const map=current.location_lat&&current.location_lng?`https://www.google.com/maps/search/?api=1&query=${current.location_lat},${current.location_lng}`:'';$('body').innerHTML=`<div class="grid"><div class="item"><small>الجوال</small><b>${esc(current.customer_phone||'—')}</b></div><div class="item"><small>الموعد الحالي</small><b>${esc(vd(current)||'—')} ${esc(vt(current)||'')}</b></div><div class="item full"><small>الموقع / الحي</small><b>${esc(current.location_label||'—')}</b></div><div class="item full"><small>ملاحظات العميل</small><b>${esc(current.customer_notes||'—')}</b></div><div class="item full"><small>ملاحظات الإدارة</small><b>${esc(current.admin_notes||'—')}</b></div>${current.facade_url?`<div class="item full"><small>صورة الواجهة</small><img class="facade" src="${esc(current.facade_url)}" alt="واجهة المنزل"></div>`:''}</div><div class="actiongrid"><a class="btn btn-green" href="tel:${esc(digits(current.customer_phone))}"><i class="fa-solid fa-phone"></i> اتصال</a><a class="btn btn-green" target="_blank" rel="noopener" href="https://wa.me/${esc(wa(current.customer_phone))}"><i class="fa-brands fa-whatsapp"></i> واتساب</a>${map?`<a class="btn btn-outline" target="_blank" rel="noopener" href="${map}"><i class="fa-solid fa-location-dot"></i> فتح الموقع</a>`:''}<button class="btn btn-primary" id="acceptBtn">قبول</button><button class="btn btn-red" id="rejectBtn">رفض</button></div><section class="resched"><h3>إعادة جدولة الموعد</h3><div class="resgrid"><input id="newDate" class="input" type="date"><select id="newTime" class="select"><option value="">اختر الوقت</option>${Array.from({length:8},(_,i)=>{let h=i+9,t=String(h).padStart(2,'0')+':00';return `<option value="${t}">${h>12?h-12:h}:00 ${h<12?'ص':'م'}</option>`}).join('')}</select></div><button id="saveSchedule" class="btn btn-primary" style="width:100%;margin-top:8px">حفظ إعادة الجدولة</button><div id="dMsg" class="msg"></div></section>`;$('acceptBtn').onclick=()=>act('accept',current.id,true);$('rejectBtn').onclick=()=>act('reject',current.id,true);$('saveSchedule').onclick=async()=>{let d=$('newDate').value,t=$('newTime').value;if(!d||!t){msg('اختر التاريخ والوقت',false);return}await act('reschedule',current.id,true,{date:d,time:t})};$('detail').classList.remove('hidden')}
function msg(t,ok){let m=$('dMsg');if(m){m.textContent=t;m.className='msg '+(ok?'okmsg':'errmsg')}}
async function act(action,id,inDetail=false,extra={}){try{if(inDetail)msg('جاري الحفظ...',true);await api({action,id,...extra});await load();if(inDetail){current=rows.find(r=>r.id===id);openDetail(id);msg(action==='accept'?'تم قبول الطلب':action==='reject'?'تم رفض الطلب':'تمت إعادة الجدولة',true)}}catch(e){const m={BOOKING_SLOT_TAKEN:'هذا الوقت محجوز لعميل آخر.',BOOKING_DAY_FULL:'اكتمل عدد العملاء لهذا اليوم.',BOOKING_DATE_CLOSED:'التاريخ غير متاح. اختر من بكرة وتجنب الجمعة.',BOOKING_TIME_CLOSED:'اختر وقتًا من 9 صباحًا إلى 4 عصرًا.',UPDATE_FAILED:'تعذر حفظ التعديل.'}[e.message]||'تعذر تنفيذ العملية';if(inDetail)msg(m,false);else alert(m)}}
if(code)enterAuto();async function enterAuto(){try{await load(true);$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}catch{sessionStorage.removeItem('hulull_field_code')}}
</script></body></html>
